<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedimentos | MSC - Odonto</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f8fc;
            color: #12304a;
        }
        .container { width: 100%; padding: 22px; }
        .cabecalho {
            display: flex; justify-content: space-between; align-items: center;
            gap: 15px; margin-bottom: 18px;
        }
        .titulo h2 { margin: 0 0 5px; font-size: 24px; }
        .titulo p { margin: 0; color: #64748b; }
        .btn-novo {
            border: 0; background: #2563eb; color: #fff; padding: 11px 16px;
            border-radius: 9px; cursor: pointer; font-weight: 700;
        }
        .grid {
            display: grid; grid-template-columns: minmax(280px, 390px) 1fr;
            gap: 18px; align-items: start;
        }
        .card {
            background: #fff; border-radius: 14px; padding: 20px;
            box-shadow: 0 4px 15px rgba(15, 45, 75, .08);
        }
        .card h3 { margin: 0 0 16px; }
        label { display:block; font-size:13px; font-weight:700; margin: 12px 0 6px; }
        input, textarea {
            width: 100%; border:1px solid #cbd5e1; border-radius:9px;
            padding:11px 12px; font-size:14px; outline:none;
        }
        input:focus, textarea:focus { border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.10); }
        textarea { resize: vertical; min-height: 90px; }
        .acoes { display:flex; gap:10px; margin-top:16px; }
        .btn {
            border:0; border-radius:9px; padding:11px 15px; cursor:pointer; font-weight:700;
        }
        .btn-salvar { background:#2563eb; color:#fff; }
        .btn-limpar { background:#e2e8f0; color:#334155; }
        .mensagem { margin-top:12px; padding:10px; border-radius:8px; display:none; font-size:14px; }
        .sucesso { display:block; background:#dcfce7; color:#166534; }
        .erro { display:block; background:#fee2e2; color:#991b1b; }
        .barra-pesquisa { display:flex; gap:10px; margin-bottom:14px; }
        .barra-pesquisa input { flex:1; }
        .contador { color:#64748b; font-size:13px; margin-bottom:12px; }
        .lista { display:grid; gap:10px; }
        .item {
            border:1px solid #e2e8f0; border-radius:11px; padding:14px;
            display:flex; justify-content:space-between; align-items:center; gap:12px;
        }
        .item strong { display:block; font-size:16px; }
        .item small { display:block; color:#64748b; margin-top:4px; }
        .btn-editar {
            border:1px solid #bfdbfe; background:#eff6ff; color:#1d4ed8;
            padding:8px 11px; border-radius:8px; cursor:pointer; font-weight:700;
        }
        .vazio { text-align:center; padding:28px 10px; color:#64748b; }
        .modal {
            display:none; position:fixed; inset:0; background:rgba(15,23,42,.55);
            align-items:center; justify-content:center; padding:20px; z-index:20;
        }
        .modal.aberto { display:flex; }
        .modal-card {
            width:min(500px,100%); background:#fff; border-radius:14px;
            padding:20px; box-shadow:0 15px 40px rgba(0,0,0,.20);
        }
        .modal-topo { display:flex; justify-content:space-between; align-items:center; }
        .fechar { border:0; background:transparent; font-size:22px; cursor:pointer; }
        @media(max-width:800px) {
            .grid { grid-template-columns:1fr; }
            .cabecalho { flex-direction:column; align-items:stretch; }
            .btn-novo { width:100%; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="cabecalho">
        <div class="titulo">
            <h2>🦷 Procedimentos</h2>
            <p>Cadastre somente os tipos de procedimentos realizados pela clínica.</p>
        </div>
        <button class="btn-novo" type="button" onclick="focarCadastro()">＋ Novo procedimento</button>
    </div>

    <div class="grid">
        <section class="card" id="cadastro">
            <h3>➕ Cadastro de procedimento</h3>
            <form id="formProcedimento">
                <label for="nome">Tipo do procedimento *</label>
                <input id="nome" name="nome" type="text"
                       placeholder="Ex.: Limpeza, Avaliação, Restauração..." required maxlength="150">

                <label for="descricao">Descrição (opcional)</label>
                <textarea id="descricao" name="descricao"
                          placeholder="Observações sobre o procedimento"></textarea>

                <div class="acoes">
                    <button class="btn btn-salvar" type="submit">💾 Salvar procedimento</button>
                    <button class="btn btn-limpar" type="button" id="btnLimpar">Limpar</button>
                </div>
                <div id="mensagem" class="mensagem"></div>
            </form>
        </section>

        <section class="card">
            <h3>📋 Procedimentos cadastrados</h3>
            <div class="barra-pesquisa">
                <input id="pesquisa" type="search" placeholder="🔎 Pesquisar procedimento...">
            </div>
            <div id="contador" class="contador">Faça uma pesquisa para visualizar os procedimentos.</div>
            <div id="listaProcedimentos" class="lista">
                <div class="vazio">🔎 Pesquise um procedimento para visualizar os resultados.</div>
            </div>
        </section>
    </div>
</div>

<div id="modalEditar" class="modal" aria-hidden="true">
    <div class="modal-card">
        <div class="modal-topo">
            <h3>✏️ Editar procedimento</h3>
            <button class="fechar" type="button" onclick="fecharModal()">×</button>
        </div>
        <form id="formEditar">
            <input type="hidden" id="editarId">
            <label for="editarNome">Tipo do procedimento *</label>
            <input id="editarNome" type="text" required maxlength="150">

            <label for="editarDescricao">Descrição (opcional)</label>
            <textarea id="editarDescricao"></textarea>

            <div class="acoes">
                <button class="btn btn-salvar" type="submit">💾 Salvar alterações</button>
                <button class="btn btn-limpar" type="button" onclick="fecharModal()">Cancelar</button>
            </div>
            <div id="mensagemEditar" class="mensagem"></div>
        </form>
    </div>
</div>

<script src="procedimentos.js?v=20260912-procedimentos"></script>
</body>
</html>
