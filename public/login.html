<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Clínica Odontológica</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;600;700&display=swap');

* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px;
    background: #53a4f5;
    font-family: "Roboto Slab", Georgia, serif;
    color: #ffffff;
}

.card {
    width: min(750px, 50%);
    background: #1d3b57;
    padding: 60px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,.18);
    box-shadow: 0 12px 32px rgba(13,42,70,.28);
}

h1 {
    margin: 0 0 14px;
    color: #ffffff;
    font-size: clamp(30px, 4vw, 42px);
}

.card > p {
    margin: 0 0 26px;
    color: #e7f1fb;
    font-size: 18px;
}

.campo { margin-bottom: 20px; }

label {
    display: block;
    font-weight: 700;
    margin-bottom: 8px;
    font-size: 18px;
    color: #ffffff;
}

input {
    width: 100%;
    padding: 16px;
    border: 1px solid #8db5d6;
    border-radius: 10px;
    font-family: inherit;
    font-size: 17px;
    color: #2d4154;
    background: #ffffff;
    outline: none;
}

input:focus {
    border-color: #53a4f5;
    box-shadow: 0 0 0 3px rgba(83,164,245,.28);
}

button {
    width: 100%;
    border: 0;
    border-radius: 10px;
    padding: 16px;
    background: #176b42;
    color: #ffffff;
    font-family: inherit;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.msg {
    display: none;
    margin-top: 16px;
    padding: 13px;
    border-radius: 10px;
    font-weight: 600;
}

.erro {
    background: #fee2e2;
    color: #991b1b;
}

.sucesso {
    background: #dcfce7;
    color: #166534;
}

.links {
    text-align: center;
    margin-top: 22px;
}

.links a {
    color: #ffffff;
    font-weight: 700;
    text-decoration: none;
    display: block;
    margin: 12px 0;
}

.links a:hover {
    text-decoration: underline;
}

@media (max-width: 600px) {
    body { padding: 14px; }
    .card { padding: 28px 22px; }
}
</style>
</head>

<body>
<section class="card">
    <h1>🔐 Entrar no sistema</h1>
    <p>Informe seu nome de usuário e PIN numérico.</p>

    <form id="formLogin">
        <div class="campo">
            <label for="nome">Nome de usuário</label>
            <input id="nome" type="text" maxlength="100" required autocomplete="username" placeholder="Digite seu nome de usuário">
        </div>

        <div class="campo">
            <label for="pin">PIN</label>
            <input id="pin" type="password" inputmode="numeric" maxlength="12" required autocomplete="current-password">
        </div>

        <button id="btnLogin" type="submit">Entrar</button>
        <div id="msg" class="msg"></div>
    </form>

    <div class="links">
        <a href="esqueci-pin.html">Esqueci meu PIN</a>
        <a href="usuarios.html">Voltar para usuários</a>
    </div>
</section>

<script src="login.js?v=20260912-nome-v2"></script>
</body>
</html>
