<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usuários do Sistema</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6f8;color:#27364a}
.container{max-width:1200px;margin:0 auto;padding:20px}
.menu{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.menu a{background:#fff;color:#27364a;text-decoration:none;padding:12px 16px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.08);font-weight:600}
.menu a.ativo{background:#176b42;color:#fff}
.grid{display:grid;grid-template-columns:minmax(320px,420px) 1fr;gap:20px}
.card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
h1,h2{margin-top:0}
.campo{margin-bottom:16px}
label{display:block;font-weight:700;margin-bottom:7px}
input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px;outline:none}
input:focus{border-color:#176b42;box-shadow:0 0 0 3px rgba(23,107,66,.12)}
.pin-box{position:relative}
.pin-box input{padding-right:52px}
.btn-olho{position:absolute;right:7px;top:7px;border:0;border-radius:7px;padding:8px;cursor:pointer;background:#eef2f7}
.btn{border:0;border-radius:9px;padding:13px 18px;font-size:16px;font-weight:700;cursor:pointer}
.btn-principal{background:#176b42;color:#fff;width:100%}
.btn-principal:disabled{opacity:.6;cursor:wait}
.mensagem{display:none;margin-top:15px;padding:12px;border-radius:9px;font-weight:600}
.mensagem.sucesso{background:#dcfce7;color:#166534}
.mensagem.erro{background:#fee2e2;color:#991b1b}
.usuario{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:15px 0;border-bottom:1px solid #e5e7eb}
.usuario:last-child{border-bottom:0}
.badge{padding:6px 10px;border-radius:999px;font-size:13px;font-weight:700;background:#dcfce7;color:#166534}
.vazio{text-align:center;padding:40px;color:#64748b}
small{color:#64748b}
@media(max-width:850px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="container">
<nav class="menu">
<a href="dashboard.html">📊 Dashboard</a>
<a href="agenda.html">📅 Agenda</a>
<a href="pacientes.html">👤 Pacientes</a>
<a href="dentistas.html">🦷 Dentistas</a>
<a href="retornos.html">🔁 Retornos</a>
<a href="usuarios.html" class="ativo">👥 Usuários</a>
</nav>

<div class="grid">
<section class="card">
<h1>👥 Cadastro de usuários</h1>
<p>Informe somente o nome e o PIN numérico.</p>

<form id="formUsuario">
<div class="campo">
<label for="nome">Nome *</label>
<input id="nome" type="text" maxlength="100" required placeholder="Digite o nome do usuário">
</div>

<div class="campo">
<label for="pin">PIN numérico *</label>
<div class="pin-box">
<input id="pin" type="password" inputmode="numeric" maxlength="12" required placeholder="Ex.: 1234" autocomplete="new-password">
<button class="btn-olho" type="button" id="mostrarPin" aria-label="Mostrar PIN">👁</button>
</div>
<small>Somente números, mínimo de 4 dígitos.</small>
</div>

<div class="campo">
<label for="confirmarPin">Confirmar PIN *</label>
<div class="pin-box">
<input id="confirmarPin" type="password" inputmode="numeric" maxlength="12" required placeholder="Repita o PIN" autocomplete="new-password">
<button class="btn-olho" type="button" id="mostrarConfirmarPin" aria-label="Mostrar PIN">👁</button>
</div>
</div>

<button class="btn btn-principal" id="btnSalvar" type="submit">💾 Cadastrar usuário</button>
<div id="mensagem" class="mensagem"></div>
</form>
</section>

<section class="card">
<h2>📋 Usuários cadastrados</h2>
<div id="listaUsuarios">
<div class="vazio">⏳ Carregando usuários...</div>
</div>
</section>
</div>
</main>
<script src="usuarios.js"></script>
</body>
</html>
